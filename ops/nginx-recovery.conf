# CryptoPredict recovery reverse proxy — HTTPS only.
# Intended for /etc/nginx/sites-available/cryptopredict-recovery
#
# Prerequisites:
#   - DNS api.cryptopredict.app -> VPS public IP
#   - certificate installed by certbot or another ACME client
#   - FastAPI recovery process listening ONLY on 127.0.0.1:8000
#
# Do not expose port 8000 publicly.

server {
    listen 80;
    listen [::]:80;
    server_name api.cryptopredict.app;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.cryptopredict.app;

    ssl_certificate /etc/letsencrypt/live/api.cryptopredict.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.cryptopredict.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:CPSSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "no-store" always;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }
}
